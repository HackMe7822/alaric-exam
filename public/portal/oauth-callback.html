<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in…</title>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8f9fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; flex-direction: column; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #6b7280; font-size: 0.9rem; margin: 0; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>Completing sign-in…</p>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var error = params.get('oauth_error');

  if (window.opener && !window.opener.closed) {
    if (token) {
      window.opener.postMessage({ type: 'oauth_success', token: token }, window.location.origin);
    } else if (error) {
      window.opener.postMessage({ type: 'oauth_error', error: decodeURIComponent(error) }, window.location.origin);
    }
    setTimeout(function() { window.close(); }, 300);
  } else {
    // Opened directly (no popup parent) — redirect to portal
    if (token) {
      localStorage.setItem('portal_token', token);
      window.location.href = '/portal?token=' + encodeURIComponent(token);
    } else {
      window.location.href = '/portal' + (error ? '?oauth_error=' + error : '');
    }
  }
})();
</script>
</body>
</html>
