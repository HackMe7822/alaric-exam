<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Requests — Alaric Exam</title>
<link rel="stylesheet" href="/assets/css/admin.css">
<style>
  /* ── Page layout ── */
  #ar-page { display:flex; gap:0; height:calc(100vh - 56px); overflow:hidden; }
  #ar-left  { width:420px; min-width:320px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:#fff; }
  #ar-right { flex:1; min-width:0; min-height:0; background:#f8f9fb; display:flex; flex-direction:column; overflow:hidden; }
  #ar-right.empty-state { align-items:center; justify-content:center; }

  /* ── Left toolbar ── */
  .ar-toolbar { padding:12px 14px; border-bottom:1px solid var(--border); background:#fafbfc; display:flex; flex-direction:column; gap:8px; }
  .ar-filter-tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .ar-tab { padding:4px 12px; border:1px solid var(--border); border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; background:#fff; color:var(--gray); transition:all .15s; }
  .ar-tab.active { background:var(--mid); color:#fff; border-color:var(--mid); }
  .ar-search { width:100%; padding:7px 11px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
  .ar-search:focus { border-color:var(--mid); }
  .ar-toolbar-bottom { display:flex; align-items:center; justify-content:space-between; }
  .ar-count-lbl { font-size:11px; color:var(--gray); }

  /* ── Request list ── */
  #ar-list { flex:1; overflow-y:auto; }
  .ar-empty { text-align:center; padding:48px 20px; color:var(--gray); font-size:13px; }
  .ar-card { padding:13px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; display:flex; gap:11px; align-items:flex-start; }
  .ar-card:hover { background:#f5f7fa; }
  .ar-card.selected { background:#EEF4FF; border-left:3px solid var(--mid); padding-left:11px; }
  .ar-avatar { width:36px; height:36px; border-radius:50%; background:var(--mid); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ar-card-info { flex:1; min-width:0; }
  .ar-card-top { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:2px; }
  .ar-card-name { font-size:13px; font-weight:600; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ar-card-time { font-size:10px; color:var(--gray); white-space:nowrap; flex-shrink:0; }
  .ar-card-email { font-size:11px; color:var(--gray); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ar-card-exam { font-size:12px; color:var(--mid); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ar-card-bottom { display:flex; align-items:center; gap:6px; margin-top:4px; }
  .ar-status { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; white-space:nowrap; }
  .ar-status.pending  { background:#fff3cd; color:#856404; }
  .ar-status.approved { background:#d1fae5; color:#065f46; }
  .ar-status.rejected { background:#fee2e2; color:#991b1b; }
  .ar-card-msg { font-size:11px; color:var(--gray); font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }

  /* ── Right detail panel ── */
  .ar-detail-placeholder { color:var(--gray); text-align:center; }
  .ar-detail-placeholder .icon { font-size:3rem; margin-bottom:12px; display:block; }
  .ar-detail-placeholder p { font-size:13px; }
  #ar-detail-content { flex:1; overflow-y:auto; padding:22px 24px; min-height:0; display:block; }
  #ar-detail-content > * { margin-bottom:18px; }
  #ar-detail-content > *:last-child { margin-bottom:0; }

  /* Exam card */
  .ar-exam-card { background:linear-gradient(135deg,#002B5C 0%,#0052a3 100%); color:#fff; border-radius:10px; padding:18px 20px; }
  .ar-exam-card-code { font-size:11px; opacity:.65; text-transform:uppercase; letter-spacing:.07em; margin-bottom:4px; }
  .ar-exam-card-title { font-size:17px; font-weight:700; margin-bottom:10px; }
  .ar-exam-chips { display:flex; gap:12px; flex-wrap:wrap; }
  .ar-exam-chip { font-size:12px; opacity:.85; display:flex; align-items:center; gap:5px; }
  .ar-exam-desc-text { font-size:12px; opacity:.7; margin-top:10px; line-height:1.6; }

  /* Sections */
  .ar-section { background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .ar-section-head { padding:11px 16px; background:#f8f9fb; border-bottom:1px solid var(--border); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); display:flex; align-items:center; gap:6px; }
  .ar-section-body { padding:14px 16px; }

  /* Requester grid */
  .ar-req-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ar-field .lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); margin-bottom:3px; }
  .ar-field .val { font-size:13px; color:var(--dark); font-weight:500; }
  .ar-msg-box { margin-top:12px; background:#f8f9fa; border:1px solid var(--border); border-left:3px solid var(--mid); border-radius:0 6px 6px 0; padding:10px 12px; font-size:13px; color:var(--dark); font-style:italic; line-height:1.6; }

  /* History timeline */
  .ar-tl { display:flex; flex-direction:column; gap:0; }
  .ar-tl-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f1f3f5; }
  .ar-tl-item:last-child { border-bottom:none; }
  .ar-tl-dot { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .ar-tl-dot.pending  { background:#fff3cd; }
  .ar-tl-dot.approved { background:#d1fae5; }
  .ar-tl-dot.rejected { background:#fee2e2; }
  .ar-tl-dot.current  { box-shadow:0 0 0 2px var(--mid); }
  .ar-tl-body { flex:1; min-width:0; }
  .ar-tl-row1 { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:2px; }
  .ar-tl-exam { font-size:13px; font-weight:600; color:var(--dark); }
  .ar-tl-small { font-size:11px; color:var(--gray); }
  .ar-curr-tag { font-size:10px; background:#e0edff; color:var(--mid); padding:2px 7px; border-radius:10px; font-weight:600; }
  .ar-tl-reviewer { font-size:11px; color:var(--gray); margin-top:2px; }
  .ar-tl-link { font-size:11px; color:var(--mid); margin-top:2px; }

  /* ── Action footer ── */
  #ar-action-footer { border-top:1px solid var(--border); background:#fff; padding:14px 20px; flex-shrink:0; }
  .ar-footer-main { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ar-expiry-row { display:flex; align-items:center; gap:8px; }
  .ar-expiry-label { font-size:12px; color:var(--gray); white-space:nowrap; }
  .ar-expiry-sel { padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; }
  .btn-approve-ar { padding:9px 20px; background:#16a34a; color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; white-space:nowrap; }
  .btn-approve-ar:hover { background:#15803d; }
  .btn-approve-ar:disabled { opacity:.5; cursor:not-allowed; }
  .btn-reject-toggle { padding:9px 16px; background:#fff; color:#dc2626; border:1.5px solid #dc2626; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .btn-reject-toggle:hover { background:#dc2626; color:#fff; }

  /* Reject reason inline form */
  .ar-reject-form { margin-top:12px; padding:12px 14px; background:#fff5f5; border:1px solid #fecaca; border-radius:8px; display:none; }
  .ar-reject-form.show { display:block; }
  .ar-reject-form label { font-size:12px; font-weight:600; color:#991b1b; display:block; margin-bottom:6px; }
  .ar-reject-textarea { width:100%; padding:8px 10px; border:1px solid #fca5a5; border-radius:6px; font-size:13px; font-family:inherit; resize:vertical; min-height:68px; outline:none; }
  .ar-reject-textarea:focus { border-color:#dc2626; }
  .ar-reject-form-btns { display:flex; gap:8px; margin-top:10px; }
  .btn-confirm-reject { padding:8px 18px; background:#dc2626; color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn-confirm-reject:hover { background:#b91c1c; }
  .btn-confirm-reject:disabled { opacity:.5; cursor:not-allowed; }
  .btn-cancel-reject { padding:8px 14px; background:#fff; border:1px solid var(--border); border-radius:6px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>

<!-- ══════════════════ SIDEBAR ══════════════════ -->
<div id="sidebar">
  <div class="brand"><svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#00B4D8" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg><span>Alaric</span> Exam</div>
  <nav>
    <div class="nav-label">MAIN</div>
    <a href="/admin/dashboard">📊 Dashboard</a>
    <a href="/admin/exams">📋 Exams</a>
    <a href="/admin/questions">❓ Question Bank</a>
    <a href="/admin/candidates">👥 Candidates</a>
    <div class="nav-label">REVIEW</div>
    <a href="/admin/checker">✅ Review Queue</a>
    <a href="/admin/monitor">🖥️ Live Monitor</a>
    <a href="/admin/results">🏆 Results</a>
    <a href="/admin/analytics">📈 Analytics</a>
    <a href="/admin/access-requests" class="active">📩 Access Requests <span id="sb-ar-badge" style="display:none;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:4px"></span></a>
    <div class="nav-label">ADMIN</div>
    <a href="/admin/users">👤 Users</a>

    <a href="/admin/settings">⚙️ Settings</a>
    <a href="/admin/recycle-bin">🗑️ Recycle Bin</a>

  <div class="sidebar-user"><strong id="sb-name">Loading…</strong><span id="sb-role"></span></div>

<!-- ══════════════════ MAIN ══════════════════ -->
<div id="main">
  <div id="topbar">
    <h1>Access Requests</h1>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadArList()">↺ Refresh</button>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div id="ar-page">
    <!-- LEFT: Request list -->
    <div id="ar-left">
      <div class="ar-toolbar">
        <input type="text" id="ar-search" class="ar-search" placeholder="🔍  Search name, email, exam…" oninput="debounceSearch()">
        <div class="ar-filter-tabs">
          <button class="ar-tab active" id="ar-tab-pending"  onclick="setFilter('pending')">⏳ Pending</button>
          <button class="ar-tab"        id="ar-tab-approved" onclick="setFilter('approved')">✅ Approved</button>
          <button class="ar-tab"        id="ar-tab-rejected" onclick="setFilter('rejected')">❌ Rejected</button>
          <button class="ar-tab"        id="ar-tab-"         onclick="setFilter('')">All</button>
        </div>
        <div class="ar-toolbar-bottom">
          <span class="ar-count-lbl" id="ar-count-lbl"></span>
        </div>
      </div>
      <div id="ar-list">
        <div class="ar-empty"><span class="spinner" style="width:22px;height:22px;border-width:3px"></span></div>
      </div>
    </div>

    <!-- RIGHT: Detail panel -->
    <div id="ar-right" class="empty-state">
      <div class="ar-detail-placeholder" id="ar-placeholder">
        <span class="icon">📩</span>
        <p>Select a request from the list<br>to review its details.</p>
      </div>
      <div id="ar-detail-content" style="display:none"></div>
      <div id="ar-action-footer" style="display:none">
        <div class="ar-footer-main">
          <div class="ar-expiry-row">
            <span class="ar-expiry-label">Expires:</span>
            <select class="ar-expiry-sel" id="ar-expiry">
              <option value="24">24 hours</option>
              <option value="48">48 hours</option>
              <option value="72" selected>72 hours (3 days)</option>
              <option value="168">7 days</option>
              <option value="336">14 days</option>
              <option value="720">30 days</option>
            </select>
          </div>
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--gray)" title="If checked, the exam link can only be used once. Uncheck to allow the candidate to re-enter.">
            <input type="checkbox" id="ar-one-time" checked style="cursor:pointer"> One-time link
          </label>
          <button class="btn-reject-toggle" id="btn-reject-toggle" onclick="toggleRejectForm()">❌ Reject</button>
          <button class="btn-approve-ar" id="btn-approve" onclick="doApprove()">✅ Approve &amp; Send Link</button>
          <button class="btn btn-danger btn-sm" id="btn-delete-ar" onclick="doDeleteRequest()" title="Move to recycle bin" style="margin-left:auto">🗑️ Delete</button>
        </div>
        <!-- Inline reject form -->
        <div class="ar-reject-form" id="ar-reject-form">
          <label>Reason for rejection <span style="font-weight:400;color:#9ca3af">(optional — shown to candidate)</span></label>
          <textarea class="ar-reject-textarea" id="ar-reject-reason" placeholder="E.g. This exam requires prior enrollment. Please contact your administrator."></textarea>
          <div class="ar-reject-form-btns">
            <button class="btn-confirm-reject" id="btn-confirm-reject" onclick="doReject()">Confirm Rejection</button>
            <button class="btn-cancel-reject"  onclick="toggleRejectForm()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tc"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let _filter = 'pending';
let _requests = [];
let _selected = null;
let _history  = [];
let _submissions = [];
let _searchTimer = null;

// ── Auth / Boot ────────────────────────────────────────────────────────────────
async function init() {
  const r = await fetch('/api/auth/me', {credentials:'include'});
  if (!r.ok) return window.location.href = '/admin';
  const user = await r.json();
  document.getElementById('sb-name').textContent = user.full_name;
  document.getElementById('sb-role').textContent = user.role.replace(/_/g,' ');
  window._user = user;
  await loadArList();
}
document.getElementById('logoutBtn').onclick = async () => {
  await fetch('/api/auth/logout', {method:'POST',credentials:'include'});
  window.location.href = '/admin';
};
function toast(msg,type='success'){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.getElementById('tc').appendChild(t);setTimeout(()=>t.remove(),3500);}
async function api(method,url,body){const r=await fetch(url,{method,credentials:'include',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(r.status===401)window.location.href='/admin';return r;}

// ── Load list ──────────────────────────────────────────────────────────────────
async function loadArList() {
  document.getElementById('ar-list').innerHTML = '<div class="ar-empty"><span class="spinner" style="width:22px;height:22px;border-width:3px"></span></div>';
  const search = document.getElementById('ar-search').value.trim();
  let url = '/api/exams/access-requests/all?';
  if (_filter) url += `status=${_filter}&`;
  if (search)  url += `search=${encodeURIComponent(search)}&`;
  try {
    const r = await api('GET', url);
    _requests = await r.json();
    renderList();
    // Update badge
    const pb = await api('GET', '/api/exams/access-requests/all?status=pending');
    const pbData = await pb.json();
    const badge = document.getElementById('sb-ar-badge');
    badge.textContent = pbData.length;
    badge.style.display = pbData.length ? '' : 'none';
  } catch(e) {
    document.getElementById('ar-list').innerHTML = '<div class="ar-empty">Failed to load requests.</div>';
  }
}

function renderList() {
  const el = document.getElementById('ar-list');
  document.getElementById('ar-count-lbl').textContent = `${_requests.length} result${_requests.length!==1?'s':''}`;
  if (!_requests.length) {
    el.innerHTML = `<div class="ar-empty">No ${_filter||'matching'} requests found.</div>`;
    return;
  }
  el.innerHTML = _requests.map(req => {
    const initl = (req.name||'?')[0].toUpperCase();
    const time  = fmtRelative(req.created_at);
    const isSelected = _selected?.id === req.id;
    return `<div class="ar-card${isSelected?' selected':''}" onclick="selectRequest(${req.id})">
      <div class="ar-avatar">${esc(initl)}</div>
      <div class="ar-card-info">
        <div class="ar-card-top">
          <div class="ar-card-name">${esc(req.name)}</div>
          <div class="ar-card-time">${time}</div>
        </div>
        <div class="ar-card-email">${esc(req.email)}</div>
        <div class="ar-card-exam">📋 ${esc(req.exam_title||'—')}</div>
        <div class="ar-card-bottom">
          <span class="ar-status ${req.status}">${req.status}</span>
          ${req.message ? `<span class="ar-card-msg">"${esc(req.message)}"</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Select request ─────────────────────────────────────────────────────────────
async function selectRequest(reqId) {
  _selected = _requests.find(r => r.id === reqId);
  if (!_selected) return;
  renderList(); // re-render to update selected highlight

  // Load request history + exam submissions in parallel
  try {
    const [hr, sr] = await Promise.all([
      api('GET', `/api/exams/access-requests/history?email=${encodeURIComponent(_selected.email)}`),
      api('GET', `/api/exams/access-requests/submissions?email=${encodeURIComponent(_selected.email)}`)
    ]);
    _history = await hr.json();
    _submissions = await sr.json();
  } catch(e) { _history = []; _submissions = []; }

  renderDetail();
}

function renderDetail() {
  const req = _selected;
  if (!req) return;

  // Switch right panel to detail mode
  document.getElementById('ar-right').classList.remove('empty-state');
  document.getElementById('ar-placeholder').style.display = 'none';
  document.getElementById('ar-detail-content').style.display = '';
  document.getElementById('ar-action-footer').style.display = '';
  // Reset reject form
  document.getElementById('ar-reject-form').classList.remove('show');
  document.getElementById('ar-reject-reason').value = '';

  // ── Exam card ──────────────────────────────────────────────────────────────
  const examMeta = [
    req.duration_minutes ? `⏱ ${req.duration_minutes} min`    : '',
    req.total_marks      ? `📊 ${req.total_marks} marks`       : '',
    req.pass_marks       ? `✅ Pass: ${req.pass_marks}`         : '',
    req.question_count   ? `❓ ${req.question_count} questions` : '',
    req.exam_status      ? `🔖 ${req.exam_status}`              : '',
  ].filter(Boolean);

  const examHtml = `<div class="ar-exam-card">
    <div class="ar-exam-card-code">${esc(req.exam_code||'')}</div>
    <div class="ar-exam-card-title">${esc(req.exam_title||'—')}</div>
    <div class="ar-exam-chips">${examMeta.map(m=>`<span class="ar-exam-chip">${m}</span>`).join('')}</div>
    ${req.exam_description?`<div class="ar-exam-desc-text">${esc(req.exam_description)}</div>`:''}
  </div>`;

  // ── Requester details ──────────────────────────────────────────────────────
  const reqHtml = `<div class="ar-section">
    <div class="ar-section-head">👤 Requester Details</div>
    <div class="ar-section-body">
      <div class="ar-req-grid">
        <div class="ar-field"><div class="lbl">Full Name</div><div class="val">${esc(req.name)}</div></div>
        <div class="ar-field"><div class="lbl">Email Address</div><div class="val">${esc(req.email)}</div></div>
        <div class="ar-field"><div class="lbl">Request Date</div><div class="val">${fmtDt(req.created_at)}</div></div>
        <div class="ar-field"><div class="lbl">Current Status</div><div class="val"><span class="ar-status ${req.status}">${req.status}</span></div></div>
        ${req.reviewed_at?`<div class="ar-field"><div class="lbl">Reviewed</div><div class="val">${fmtDt(req.reviewed_at)}</div></div>`:''}
        ${req.reviewer_name?`<div class="ar-field"><div class="lbl">Reviewed By</div><div class="val">${esc(req.reviewer_name)}</div></div>`:''}
      </div>
      ${req.message?`<div class="ar-msg-box">"${esc(req.message)}"</div>`:''}
    </div>
  </div>`;

  // ── History timeline ───────────────────────────────────────────────────────
  const tlItems = _history.map(h => {
    const isCurr = h.id === req.id;
    const icon = h.status==='pending'?'⏳':h.status==='approved'?'✅':'❌';
    return `<div class="ar-tl-item">
      <div class="ar-tl-dot ${h.status}${isCurr?' current':''}">${icon}</div>
      <div class="ar-tl-body">
        <div class="ar-tl-row1">
          <span class="ar-tl-exam">${esc(h.exam_title||'—')}</span>
          <span class="ar-tl-small">[${esc(h.exam_code||'')}]</span>
          <span class="ar-status ${h.status}" style="font-size:10px;padding:1px 6px">${h.status}</span>
          ${isCurr?'<span class="ar-curr-tag">This request</span>':''}
        </div>
        <div class="ar-tl-small">Requested ${fmtDt(h.created_at)}</div>
        ${h.reviewed_at?`<div class="ar-tl-reviewer">Reviewed by <strong>${esc(h.reviewer_name||'Admin')}</strong> · ${fmtDt(h.reviewed_at)}</div>`:''}
        ${h.link_token?`<div class="ar-tl-link">🔗 Exam link was generated</div>`:''}
      </div>
    </div>`;
  }).join('');

  const histHtml = `<div class="ar-section">
    <div class="ar-section-head">🕒 Request History for ${esc(req.email)} <span style="font-weight:400;text-transform:none;letter-spacing:0">(${_history.length} request${_history.length!==1?'s':''})</span></div>
    <div class="ar-section-body" style="padding:8px 16px">
      <div class="ar-tl">${tlItems||'<div class="ar-tl-small" style="padding:10px 0">No history found.</div>'}</div>
    </div>
  </div>`;

  // ── Exam attempts section ──────────────────────────────────────────────────
  let subRows = '';
  if (_submissions.length) {
    subRows = _submissions.map(s => {
      const isAbandoned = !!s.is_abandoned;
      const statusLabel = isAbandoned ? '⏹ Abandoned'
        : s.status === 'submitted'     ? '⏳ Submitted'
        : s.status === 'grading'       ? '⏳ Under Review'
        : s.status === 'graded'        ? (s.pass_fail === 'pass' ? '✅ Passed' : '❌ Failed')
        : s.status === 'auto_submitted' ? (s.pass_fail === 'pass' ? '✅ Passed' : '❌ Failed')
        : s.status;
      const statusColor = isAbandoned ? '#9ca3af'
        : s.pass_fail === 'pass' ? '#16a34a'
        : s.pass_fail === 'fail' ? '#dc2626'
        : '#f59e0b';
      const scoreStr = !isAbandoned && s.final_score != null ? `${s.final_score} / ${s.total_marks||'?'}` : '—';
      const risk = s.risk_level ? `<span style="font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;background:${s.risk_level==='high'?'#fee2e2':s.risk_level==='medium'?'#fff3cd':'#d1fae5'};color:${s.risk_level==='high'?'#991b1b':s.risk_level==='medium'?'#856404':'#065f46'}">${s.risk_level}</span>` : '';
      return `<div class="ar-tl-item">
        <div class="ar-tl-dot" style="background:${isAbandoned?'#f3f4f6':'#eff6ff'};font-size:13px">${isAbandoned?'⏹':s.pass_fail==='pass'?'✅':'❌'}</div>
        <div class="ar-tl-body">
          <div class="ar-tl-row1">
            <span class="ar-tl-exam">${esc(s.exam_title||'—')}</span>
            <span class="ar-tl-small">[${esc(s.exam_code||'')}]</span>
            <span style="font-size:10px;font-weight:700;color:${statusColor}">${statusLabel}</span>
            ${risk}
          </div>
          <div class="ar-tl-small">Started ${fmtDt(s.started_at)}${s.submitted_at&&!isAbandoned?` · Submitted ${fmtDt(s.submitted_at)}`:''}</div>
          <div class="ar-tl-small" style="margin-top:2px">Score: <strong>${scoreStr}</strong>${s.result_released?'':' <span style="color:#9ca3af">(result not released)</span>'}</div>
        </div>
      </div>`;
    }).join('');
  }
  const attemptsHtml = `<div class="ar-section">
    <div class="ar-section-head">📊 Exam Attempts by ${esc(req.email)} <span style="font-weight:400;text-transform:none;letter-spacing:0">(${_submissions.length} attempt${_submissions.length!==1?'s':''})</span></div>
    <div class="ar-section-body" style="padding:8px 16px">
      <div class="ar-tl">${subRows||'<div class="ar-tl-small" style="padding:10px 0">No exam attempts found.</div>'}</div>
    </div>
  </div>`;

  document.getElementById('ar-detail-content').innerHTML = examHtml + reqHtml + histHtml + attemptsHtml;
}

// ── Actions ────────────────────────────────────────────────────────────────────
function toggleRejectForm() {
  const form = document.getElementById('ar-reject-form');
  const isOpen = form.classList.toggle('show');
  if (isOpen) {
    document.getElementById('ar-reject-reason').focus();
    document.getElementById('btn-reject-toggle').textContent = '✕ Cancel Rejection';
  } else {
    document.getElementById('btn-reject-toggle').textContent = '❌ Reject';
    document.getElementById('ar-reject-reason').value = '';
  }
}

async function doApprove() {
  if (!_selected) return;
  const btn = document.getElementById('btn-approve');
  const hours = parseInt(document.getElementById('ar-expiry').value) || 72;
  const one_time_link = document.getElementById('ar-one-time').checked;
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await api('POST', `/api/exams/${_selected.exam_id}/access-requests/${_selected.id}/approve`, { expires_hours: hours, one_time_link });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to approve', 'error'); btn.disabled=false; btn.textContent='✅ Approve & Send Link'; return; }
    toast(`✅ Approved — exam link sent to ${_selected.email}`);
    _selected = null;
    resetDetail();
    await loadArList();
  } catch(e) { toast('Network error', 'error'); btn.disabled=false; btn.textContent='✅ Approve & Send Link'; }
}

async function doDeleteRequest() {
  if (!_selected) return;
  showConfirm(`Move this request from ${_selected.email} to the recycle bin?`, async () => {
    try {
      const r = await api('DELETE', `/api/exams/access-requests/${_selected.id}`);
      const d = await r.json();
      if (!r.ok) { toast(d.error || 'Delete failed', 'error'); return; }
      toast('Moved to recycle bin');
      _selected = null; resetDetail(); await loadArList();
    } catch(e) { toast('Network error', 'error'); }
  }, { title: 'Move to Recycle Bin', confirmText: 'Move to Bin' });
}

async function doReject() {
  if (!_selected) return;
  const reason = document.getElementById('ar-reject-reason').value.trim();
  const btn = document.getElementById('btn-confirm-reject');
  btn.disabled = true; btn.textContent = 'Rejecting…';
  try {
    const r = await api('POST', `/api/exams/${_selected.exam_id}/access-requests/${_selected.id}/reject`, { reason });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to reject', 'error'); btn.disabled=false; btn.textContent='Confirm Rejection'; return; }
    toast('Request rejected');
    _selected = null;
    resetDetail();
    await loadArList();
  } catch(e) { toast('Network error', 'error'); btn.disabled=false; btn.textContent='Confirm Rejection'; }
}

function resetDetail() {
  _submissions = [];
  document.getElementById('ar-right').classList.add('empty-state');
  document.getElementById('ar-placeholder').style.display = '';
  document.getElementById('ar-detail-content').style.display = 'none';
  document.getElementById('ar-action-footer').style.display = 'none';
  document.getElementById('ar-detail-content').innerHTML = '';
  document.getElementById('ar-reject-form').classList.remove('show');
  document.getElementById('btn-approve').disabled = false;
  document.getElementById('btn-approve').textContent = '✅ Approve & Send Link';
}

// ── Filter & search ────────────────────────────────────────────────────────────
function setFilter(f) {
  _filter = f;
  ['pending','approved','rejected',''].forEach(t => {
    const el = document.getElementById('ar-tab-' + t);
    if (el) el.classList.toggle('active', t === f);
  });
  _selected = null;
  resetDetail();
  loadArList();
}

function debounceSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => { _selected=null; resetDetail(); loadArList(); }, 300);
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fmtDt(str) {
  if (!str) return '—';
  const d = new Date(str);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function fmtRelative(str) {
  if (!str) return '';
  const diff = Date.now() - new Date(str).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1)   return 'Just now';
  if (mins < 60)  return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24)   return `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  if (days < 7)   return `${days}d ago`;
  return new Date(str).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

init();
</script>
