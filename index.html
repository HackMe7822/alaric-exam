<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ-104 Azure Administrator — Evaluation Exam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(145deg,#0a0f1a 0%,#0d1b2a 50%,#1b2838 100%);color:#e0e6ed;min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
  .start-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .start-inner{max-width:640px;width:100%;text-align:center}
  .start-badge{font-size:14px;letter-spacing:6px;color:#0078D4;font-weight:700;margin-bottom:12px;text-transform:uppercase}
  .start-title{font-size:56px;font-weight:800;background:linear-gradient(135deg,#0078D4,#00BCF2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
  .start-subtitle{font-size:20px;color:#8899aa;margin-top:8px;margin-bottom:40px;font-weight:500}
  .start-card{background:rgba(255,255,255,0.04);border-radius:16px;padding:32px 28px;border:1px solid rgba(255,255,255,0.06);text-align:left;margin-bottom:32px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .stat-box{text-align:center;padding:16px;background:rgba(0,120,212,0.06);border-radius:10px;border:1px solid rgba(0,120,212,0.12)}
  .stat-val{font-size:28px;font-weight:800;color:#0078D4}
  .stat-label{font-size:12px;color:#6b7f8e;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
  .domain-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
  .domain-row:last-child{border-bottom:none}
  .domain-row-left{display:flex;align-items:center;gap:10px}
  .domain-dot{width:10px;height:10px;border-radius:3px}
  .domain-row-left span{font-size:14px;color:#a0adb8}
  .domain-row-right{font-size:13px;color:#6b7f8e}
  .name-input-wrap{margin-bottom:28px}
  .name-label{font-size:13px;color:#6b7f8e;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;text-align:left}
  .name-input{width:100%;padding:14px 18px;border-radius:10px;border:2px solid rgba(0,120,212,0.25);background:rgba(0,0,0,0.3);color:#e0e6ed;font-size:16px;outline:none;transition:border-color 0.2s}
  .name-input:focus{border-color:#0078D4}
  .name-input::placeholder{color:#3a4a5a}
  .btn-start{background:linear-gradient(135deg,#0078D4,#005a9e);color:#fff;border:none;padding:16px 64px;border-radius:12px;font-size:18px;font-weight:700;letter-spacing:1px;transition:transform 0.15s,opacity 0.15s;box-shadow:0 4px 24px rgba(0,120,212,0.35)}
  .btn-start:hover:not(:disabled){transform:scale(1.03)}
  .btn-start:disabled{opacity:0.4;cursor:not-allowed}
  .start-note{margin-top:16px;font-size:12px;color:#4a5568}
  .topbar{background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.06);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-logo{font-weight:800;font-size:16px;color:#0078D4}
  .topbar-name{font-size:12px;color:#8899aa;background:rgba(255,255,255,0.04);padding:4px 10px;border-radius:6px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar-count{font-size:12px;color:#4a5568;background:rgba(255,255,255,0.04);padding:4px 10px;border-radius:6px}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .timer{font-family:monospace;font-size:18px;font-weight:700;background:rgba(0,0,0,0.3);padding:6px 14px;border-radius:8px}
  .timer.green{color:#00A86B}.timer.yellow{color:#F59E0B}.timer.red{color:#E74856}
  .btn-nav-toggle{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#6b7f8e;font-size:13px;font-weight:600}
  .btn-nav-toggle.active{border-color:#0078D4;background:rgba(0,120,212,0.15);color:#3ba4ff}
  .btn-submit-top{padding:8px 20px;border-radius:8px;background:#E74856;color:#fff;border:none;font-size:13px;font-weight:700}
  .exam-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px)}
  .nav-panel{width:280px;min-width:280px;background:rgba(0,0,0,0.2);border-right:1px solid rgba(255,255,255,0.06);padding:16px;overflow-y:auto}
  .nav-title{font-size:12px;color:#4a5568;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px}
  .nav-legend{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .nav-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#4a5568}
  .nav-legend-dot{width:10px;height:10px;border-radius:3px}
  .nav-domain-label{font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px}
  .nav-btn{width:100%;aspect-ratio:1;border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;padding:0;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#4a5568}
  .nav-btn.answered{background:rgba(0,168,107,0.15);color:#4ade80}
  .nav-btn.current{border:2px solid #0078D4;background:rgba(0,120,212,0.2);color:#3ba4ff}
  .nav-btn .flag-dot{position:absolute;top:1px;right:2px;width:5px;height:5px;border-radius:50%;background:#F59E0B}
  .question-area{flex:1;overflow-y:auto;padding:28px 24px}
  .question-inner{max-width:740px;margin:0 auto}
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .q-header-left{display:flex;align-items:center;gap:10px}
  .q-number{font-size:28px;font-weight:800}
  .q-domain-badge{font-size:12px;padding:4px 12px;border-radius:6px;font-weight:600}
  .btn-flag{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#4a5568;font-size:13px;font-weight:600}
  .btn-flag.active{border-color:#F59E0B;background:rgba(245,158,11,0.12);color:#F59E0B}
  .q-text{font-size:16px;line-height:1.75;color:#c0cad4;margin-bottom:28px}
  .options-grid{display:grid;gap:10px;margin-bottom:36px}
  .option-btn{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:12px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);text-align:left;transition:all 0.15s;color:#8899aa}
  .option-btn:hover{border-color:rgba(0,120,212,0.3);background:rgba(0,120,212,0.04)}
  .option-btn.selected{border-color:#0078D4;background:rgba(0,120,212,0.1);color:#e0e6ed}
  .option-letter{width:30px;height:30px;min-width:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:rgba(255,255,255,0.06);color:#6b7f8e;transition:all 0.15s}
  .option-btn.selected .option-letter{background:#0078D4;color:#fff}
  .option-text{font-size:15px;line-height:1.6;padding-top:4px}
  .q-footer{display:flex;justify-content:space-between;padding-bottom:40px}
  .btn-prev,.btn-next{padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600}
  .btn-prev{border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#8899aa}
  .btn-prev:disabled{color:#2a3442;cursor:default}
  .btn-next{background:rgba(0,120,212,0.12);border:1px solid rgba(0,120,212,0.25);color:#3ba4ff;font-weight:700}
  .btn-submit-bottom{padding:12px 36px;border-radius:10px;background:linear-gradient(135deg,#00A86B,#008855);color:#fff;border:none;font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,168,107,0.3)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
  .modal-box{background:#131b28;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center}
  .modal-title{font-size:22px;font-weight:700;margin-bottom:12px}
  .modal-text{font-size:14px;color:#8899aa;margin-bottom:8px;line-height:1.6}
  .modal-warn{font-size:13px;color:#F59E0B;margin-bottom:24px}
  .modal-btns{display:flex;gap:12px;justify-content:center}
  .modal-btn-cancel{padding:10px 28px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8899aa;font-size:14px;font-weight:600}
  .modal-btn-confirm{padding:10px 28px;border-radius:10px;border:none;background:#E74856;color:#fff;font-size:14px;font-weight:700}
  .results-wrap{padding:24px 16px;min-height:100vh}
  .results-inner{max-width:800px;margin:0 auto}
  .results-header{text-align:center;margin-bottom:36px}
  .results-candidate{font-size:16px;color:#8899aa;margin-bottom:4px}
  .results-date{font-size:13px;color:#4a5568;margin-bottom:16px}
  .results-badge{font-size:14px;letter-spacing:4px;font-weight:700;text-transform:uppercase;margin-bottom:8px}
  .results-badge.pass{color:#00A86B}.results-badge.fail{color:#E74856}
  .results-score{font-size:80px;font-weight:800;-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
  .results-score.pass{background:linear-gradient(135deg,#00A86B,#00d48a);-webkit-background-clip:text}
  .results-score.fail{background:linear-gradient(135deg,#E74856,#ff6b7a);-webkit-background-clip:text}
  .results-sub{font-size:18px;color:#6b7f8e;margin-top:8px}
  .domain-scores{display:grid;gap:12px;margin-bottom:32px}
  .domain-score-card{background:rgba(255,255,255,0.03);border-radius:12px;padding:16px 20px;border:1px solid rgba(255,255,255,0.06)}
  .domain-score-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .domain-score-left{display:flex;align-items:center;gap:10px}
  .domain-score-bar-bg{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
  .domain-score-bar{height:100%;border-radius:3px;transition:width 1s ease}
  .action-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .filter-btns{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .filter-btn{padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#6b7f8e;font-size:13px;font-weight:600}
  .filter-btn.active{border-color:#0078D4;background:rgba(0,120,212,0.15);color:#3ba4ff}
  .btn-download{padding:10px 24px;border-radius:10px;background:linear-gradient(135deg,#0078D4,#005a9e);color:#fff;border:none;font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,120,212,0.3);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .btn-download:hover{transform:scale(1.02);transition:transform 0.15s}
  .review-card{background:rgba(255,255,255,0.03);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid rgba(0,168,107,0.2)}
  .review-card.wrong{border-color:rgba(231,72,86,0.2);border-left:4px solid #E74856}
  .review-card.correct{border-color:rgba(0,168,107,0.2);border-left:4px solid #00A86B}
  .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .review-header-left{display:flex;gap:8px;align-items:center}
  .review-qnum{font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
  .review-domain{font-size:11px;color:#6b7f8e}
  .review-qtext{font-size:14px;line-height:1.6;margin-bottom:14px;color:#c0cad4}
  .review-options{display:grid;gap:6px;margin-bottom:14px}
  .review-opt{padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;border:1px solid rgba(255,255,255,0.06);color:#8899aa}
  .review-opt.correct-opt{border-color:rgba(0,168,107,0.4);background:rgba(0,168,107,0.08);color:#4ade80}
  .review-opt.wrong-pick{border-color:rgba(231,72,86,0.4);background:rgba(231,72,86,0.08);color:#ff8a94}
  .review-opt .tag{margin-left:8px;font-size:11px;font-weight:700}
  .explanation-box{background:rgba(0,120,212,0.06);border:1px solid rgba(0,120,212,0.12);border-radius:8px;padding:12px 14px;font-size:13px;color:#7ab3d4;line-height:1.6}
  .explanation-box strong{color:#3ba4ff}
  .btn-retake{padding:14px 48px;border-radius:10px;background:linear-gradient(135deg,#0078D4,#005a9e);color:#fff;border:none;font-size:16px;font-weight:700;box-shadow:0 4px 24px rgba(0,120,212,0.3)}
  .btn-retake:hover{transform:scale(1.03);transition:transform 0.15s}
  @media(max-width:768px){
    .start-title{font-size:40px}
    .nav-panel{width:100%;min-width:100%;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06)}
    .exam-layout{flex-direction:column;height:auto;overflow:visible}
    .results-score{font-size:56px}
    .action-bar{flex-direction:column}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS=[
{id:1,domain:"Manage Azure Identities & Governance",q:"Your company recently migrated to Azure AD. A manager reports that a former contractor still has access to the Azure portal. The contractor\u2019s on-premises AD account was disabled two weeks ago, but Azure AD Connect syncs every 30 minutes. What is the MOST likely cause?",options:["The contractor\u2019s account was not moved to an OU outside the sync scope","Azure AD Connect delta sync has not run since the account was disabled","The disabled on-premises account is still synced as an enabled cloud account","The contractor is using a separate cloud-only Azure AD account"],answer:3,explanation:"If the contractor has a separate cloud-only Azure AD account, disabling the on-premises account has no effect. Cloud-only accounts must be managed directly in Azure AD."},
{id:2,domain:"Manage Azure Identities & Governance",q:"You need to ensure that Sales department users can only create resources in West Europe and North Europe regions. They can create any resource type within those regions. What should you configure?",options:["An Azure RBAC custom role with a location condition","An Azure Policy with the \u2018Allowed locations\u2019 built-in definition","A Management Group with a region restriction","A resource lock on all other regions"],answer:1,explanation:"The \u2018Allowed locations\u2019 Azure Policy restricts where resources can be deployed."},
{id:3,domain:"Manage Azure Identities & Governance",q:"You have three subscriptions (Dev, Staging, Production) and need a consistent \u2018CostCenter\u2019 tagging policy on every resource group, managed from a single place. What should you do?",options:["Create a Management Group, move subscriptions under it, assign Azure Policy at the Management Group level","Assign the policy individually to each subscription","Use Azure Blueprints to assign the policy to each subscription","Configure a tag in Azure Cost Management with billing alerts"],answer:0,explanation:"Management Groups allow you to apply governance controls like Azure Policy at scale across all child subscriptions."},
{id:4,domain:"Manage Azure Identities & Governance",q:"A new developer needs to deploy and manage web apps in \u2018WebApps-RG\u2019 only, without modifying networking resources or accessing other resource groups. Which RBAC assignment?",options:["Contributor role at subscription level with a deny assignment for networking","Website Contributor role at the \u2018WebApps-RG\u2019 scope","Contributor role at the \u2018WebApps-RG\u2019 scope","Owner role at the \u2018WebApps-RG\u2019 scope"],answer:1,explanation:"Website Contributor provides web app management without networking access, scoped to the specific resource group."},
{id:5,domain:"Manage Azure Identities & Governance",q:"All Global Administrators must use MFA, enforced automatically without depending on users configuring it themselves. What is the BEST approach?",options:["Enable Security Defaults in Azure AD","Create a Conditional Access policy targeting the Global Administrator role requiring MFA","Enable per-user MFA for each Global Administrator","Send a company-wide email requesting Global Admins enable MFA"],answer:1,explanation:"Conditional Access policies provide granular, enforced MFA targeting the Global Administrator role."},
{id:6,domain:"Manage Azure Identities & Governance",q:"A support engineer needs temporary Global Administrator access for 4 hours with approval required. You use Azure AD PIM. How should you configure this?",options:["Assign permanent Global Administrator and remove after 4 hours","Configure the role in PIM as eligible with 4-hour max activation and require approval","Create a Conditional Access policy granting Global Admin for 4 hours","Add the user to a group with permanent Global Administrator"],answer:1,explanation:"PIM allows just-in-time role activation with configurable time limits and approval workflows."},
{id:7,domain:"Manage Azure Identities & Governance",q:"15 users have the Owner role at subscription level but only 3 should. You need to remove unnecessary assignments with an audit trail. What should you use?",options:["Azure AD Access Reviews","Manually remove role assignments from the portal","Azure AD Entitlement Management","Azure Policy to deny Owner assignments"],answer:0,explanation:"Azure AD Access Reviews systematically review role assignments and maintain a complete audit log."},
{id:8,domain:"Manage Azure Identities & Governance",q:"External partners need access to a specific resource group using their own organization\u2019s credentials, with minimal admin overhead. What should you implement?",options:["Create new Azure AD accounts for each partner","Configure Azure AD B2B collaboration and invite partners as guests","Configure Azure AD B2C for partner access","Share a single service account"],answer:1,explanation:"Azure AD B2B allows external users to authenticate with their own identity provider."},
{id:9,domain:"Manage Azure Identities & Governance",q:"You need a custom RBAC role that allows ONLY restarting VMs (not start, stop, or delete). Which action should the role include?",options:["Microsoft.Compute/virtualMachines/*","Microsoft.Compute/virtualMachines/restart/action","Microsoft.Compute/virtualMachines/start/action","Microsoft.Compute/virtualMachines/write"],answer:1,explanation:"The restart/action permission specifically allows only the restart operation."},
{id:10,domain:"Manage Azure Identities & Governance",q:"Resources created without a \u2018Department\u2019 tag should automatically inherit it from their resource group. What should you configure?",options:["Azure Policy with \u2018Inherit a tag from the resource group if missing\u2019","An Automation runbook that adds tags nightly","Azure Policy with \u2018Deny\u2019 effect for missing tags","A Logic App that monitors creation and adds tags"],answer:0,explanation:"The built-in policy uses the Modify effect to automatically add the tag from the resource group."},
{id:11,domain:"Manage Azure Identities & Governance",q:"You need to ensure no one can delete resource locks, even Owners. What should you implement?",options:["Azure Policy with \u2018Deny\u2019 on lock deletion","A custom RBAC role excluding lock delete permission","A CanNotDelete lock on the lock itself","PIM requiring approval for Owner activation combined with deny assignments for other roles"],answer:3,explanation:"Even Owners can delete locks. PIM controls Owner activation; deny assignments prevent others from deleting locks."},
{id:12,domain:"Manage Azure Identities & Governance",q:"After acquiring a company with a separate Azure AD tenant, users in both tenants need seamless cross-tenant access. What is the LEAST disruptive solution?",options:["Migrate all users to your tenant","Configure Azure AD Cross-Tenant Synchronization","Create duplicate accounts in both tenants","Use Azure AD B2C to federate both tenants"],answer:1,explanation:"Cross-Tenant Synchronization creates B2B users automatically while maintaining home-tenant credentials."},
{id:13,domain:"Manage Azure Identities & Governance",q:"An auditor needs a report of all role assignments across all subscriptions, including inherited ones. What is the MOST efficient method?",options:["Check each subscription\u2019s IAM blade individually","Use Azure Resource Graph Explorer to query across all subscriptions","Export the Azure AD audit log","Run Get-AzRoleAssignment per subscription"],answer:1,explanation:"Azure Resource Graph queries across all subscriptions simultaneously with a single query."},
{id:14,domain:"Manage Azure Identities & Governance",q:"All resource names must start with \u2018CTX-\u2019. Non-compliant resources should be blocked from creation. What should you use?",options:["Azure Policy with a custom \u2018deny\u2019 definition using a name pattern condition","Azure Blueprints with a naming template","An Automation runbook that renames resources","A management group policy that sets default names"],answer:0,explanation:"A custom Azure Policy with the deny effect enforces naming patterns using the like or match operator."},
{id:15,domain:"Manage Azure Identities & Governance",q:"Identity Protection flags frequent travelers as \u2018High Risk\u2019 due to impossible travel. Some are legitimate. What should you do?",options:["Disable impossible travel detection","Create a Conditional Access policy requiring MFA for high-risk users so legitimate users can self-remediate","Mark all detections as safe and ignore future alerts","Exclude travelers from all Conditional Access policies"],answer:1,explanation:"Risk-based Conditional Access with MFA lets legitimate users self-remediate while maintaining security."},
{id:16,domain:"Manage Azure Identities & Governance",q:"You want to prevent users from consenting to third-party apps that read directory data. Admins should still grant consent. What should you configure?",options:["Disable user consent for all applications and configure an admin consent workflow","Block all third-party applications","Create a Conditional Access policy blocking app registrations","Remove all users from the Application Developer role"],answer:0,explanation:"Disabling user consent prevents users from granting permissions. Admin consent workflow handles legitimate requests."},
{id:17,domain:"Manage Azure Identities & Governance",q:"Your help desk team needs to reset passwords for non-admin users but NOT for any admin accounts. Which built-in role?",options:["User Administrator","Helpdesk Administrator","Authentication Administrator","Password Administrator"],answer:1,explanation:"Helpdesk Administrator can reset passwords for non-admin users but not for higher-privileged admin roles."},
{id:18,domain:"Manage Azure Identities & Governance",q:"You need a centralized dashboard to track CIS benchmark compliance across 10 subscriptions with remediation guidance. What should you use?",options:["Microsoft Defender for Cloud with the regulatory compliance dashboard","Azure Monitor workbooks","Azure Policy compliance view per subscription","Azure Advisor recommendations"],answer:0,explanation:"Defender for Cloud provides centralized regulatory compliance mapped to CIS benchmarks across all subscriptions."},
{id:19,domain:"Manage Azure Identities & Governance",q:"You need a group that automatically includes Marketing department users and removes them when they change departments. What type of group?",options:["Security group with assigned membership","Microsoft 365 group with assigned membership","Dynamic security group with a department-based membership rule","Distribution group synced from on-premises AD"],answer:2,explanation:"Dynamic security groups use rules to automatically manage membership based on user attributes."},
{id:20,domain:"Manage Azure Identities & Governance",q:"In your Azure landing zone, subscription owners should not be able to modify policies set at the management group level. How is this enforced?",options:["Management group policy assignments cannot be overridden by subscription administrators","You must apply a resource lock at the management group level","Subscription owners can always override management group policies","You must remove Owner role from all subscription admins"],answer:0,explanation:"Policies at management group scope are inherited and cannot be modified by subscription-level administrators."},
{id:21,domain:"Implement & Manage Storage",q:"Images in Azure Blob Storage (East US) load slowly for Southeast Asia users. You need to improve performance with MINIMAL app changes. What should you implement?",options:["Move the storage account to Southeast Asia","Enable Azure CDN with the storage account as origin","Configure geo-redundant storage (GRS)","Create a second storage account in SE Asia and modify the app"],answer:1,explanation:"Azure CDN caches content at edge locations worldwide with minimal application changes."},
{id:22,domain:"Implement & Manage Storage",q:"Sensitive financial reports must stay in West Europe but be recoverable if the entire region fails. What is the MOST cost-effective redundancy?",options:["LRS","ZRS","GRS","GZRS"],answer:2,explanation:"GRS replicates to a secondary region and is cheaper than GZRS while protecting against regional failures."},
{id:23,domain:"Implement & Manage Storage",q:"Legal documents must be unmodifiable for 7 years (SEC 17a-4). After 7 years, auto-delete. What should you configure?",options:["CanNotDelete resource lock","Immutable storage with 7-year retention + lifecycle management for deletion","Azure Backup for the container","ReadOnly lock on the container"],answer:1,explanation:"Immutable storage with time-based retention meets WORM compliance; lifecycle management handles auto-deletion."},
{id:24,domain:"Implement & Manage Storage",q:"Migrating 50 TB with 100 Mbps (~46 day transfer). Must complete in 2 weeks. What is the BEST solution?",options:["AzCopy over the internet","Azure Data Box (physical shipping)","Upgrade to 1 Gbps internet","Azure File Sync"],answer:1,explanation:"Azure Data Box ships up to 80 TB physically, completing within 1-2 weeks including shipping."},
{id:25,domain:"Implement & Manage Storage",q:"Table Storage with 500M IoT entities has degraded. Queries filter on DeviceId and Timestamp. How to improve performance?",options:["Increase storage throughput","Redesign partition key to DeviceId, row key to Timestamp","Migrate to Cosmos DB Table API","Create a Timestamp index"],answer:1,explanation:"DeviceId as partition key distributes data; Timestamp as row key enables efficient range queries."},
{id:26,domain:"Implement & Manage Storage",q:"Share large datasets with external partners for 24 hours, read-only, no Azure account needed. What should you configure?",options:["SAS token with Read permission and 24-hour expiry","Anonymous read access on the container","Azure AD guest accounts per partner","Stored access policy with no expiration"],answer:0,explanation:"SAS with Read and 24-hour expiry provides time-limited, read-only access without requiring Azure accounts."},
{id:27,domain:"Implement & Manage Storage",q:"Logs are hot for 30 days, cool for 60 days, then unused. Minimize costs. What should you configure?",options:["Manually move blobs between tiers","Lifecycle policy: Cool at 30 days, Archive at 90 days, delete at 365 days","Archive tier for all blobs","Blob versioning for tier transitions"],answer:1,explanation:"Lifecycle management automates tier transitions based on blob age."},
{id:28,domain:"Implement & Manage Storage",q:"App gets HTTP 403 from storage. It uses a storage account key that was regenerated yesterday. MOST likely cause?",options:["Storage firewall blocking the app\u2019s IP","App is still using the old key; update it","SAS token expired","Throughput limit exceeded"],answer:1,explanation:"Regenerating a key invalidates the old one immediately. The app must use the new key."},
{id:29,domain:"Implement & Manage Storage",q:"Azure Files users report slow performance from on-premises. The share is in a distant region. What should you implement?",options:["Enable large file shares","Deploy Azure File Sync with cloud tiering","Switch from SMB to NFS","Upgrade to Premium tier"],answer:1,explanation:"Azure File Sync creates a local cache of frequently accessed files, reducing latency dramatically."},
{id:30,domain:"Implement & Manage Storage",q:"Developer with \u2018Storage Blob Data Reader\u2019 can list blobs but can\u2019t read contents. What should you check?",options:["The role assignment scope \u2014 may be at the wrong level","Storage firewall settings","Whether the correct tenant is being used","Whether the storage key was regenerated"],answer:0,explanation:"Data Reader grants list and read. A scope mismatch (wrong container/account) is the likely cause."},
{id:31,domain:"Implement & Manage Storage",q:"Storage account should be accessible only from VNet VMs. External access blocked, but you need portal management. What to configure?",options:["Service endpoint on subnet, firewall allows that subnet + your client IP, default Deny","Private endpoint only","NSG rule on the storage account","Disable public network access entirely"],answer:0,explanation:"Service endpoints + firewall Deny blocks external access. Client IP exception allows portal management."},
{id:32,domain:"Implement & Manage Storage",q:"Millions of small blob writes per hour cause HTTP 503 throttling on Standard_LRS. What should you do FIRST?",options:["Upgrade to Premium","Distribute writes across multiple storage accounts","Enable soft delete","Switch to ADLS Gen2"],answer:1,explanation:"Distributing writes across accounts or using hash-based prefixes spreads load across partitions."},
{id:33,domain:"Implement & Manage Storage",q:"Critical blob container deleted. Container soft delete was NOT enabled. Azure Backup for Blobs has 30-day retention. What can you do?",options:["Nothing \u2014 data is lost","Restore from Azure Backup for Blobs","Contact Microsoft Support","Restore from GRS secondary"],answer:1,explanation:"Azure Backup for Blobs provides point-in-time restoration even without container soft delete."},
{id:34,domain:"Implement & Manage Storage",q:"CMK encryption config fails with an access policy error. MOST likely issue?",options:["Key Vault firewall blocks the storage account","Storage account\u2019s managed identity lacks Get/Wrap Key/Unwrap Key permissions","Encryption key expired","Storage account and Key Vault in different regions"],answer:1,explanation:"The managed identity needs Get, Wrap Key, and Unwrap Key permissions on the Key Vault."},
{id:35,domain:"Implement & Manage Storage",q:"Copy 2 TB between storage accounts in different subscriptions/regions without downloading locally. FASTEST method?",options:["Storage Explorer copy/paste","AzCopy server-to-server copy with SAS tokens","Azure Data Factory copy activity","Download and re-upload"],answer:1,explanation:"AzCopy performs server-to-server copies directly over the Azure backbone."},
{id:36,domain:"Deploy & Manage Compute",q:"Critical web app on a single VM needs 99.99% SLA. What is the MINIMUM change needed?",options:["Availability Set","Single Availability Zone","Multiple VMs across 2+ Availability Zones behind a Load Balancer","Azure Site Recovery"],answer:2,explanation:"99.99% SLA requires multi-zone deployment. Single VM = 99.9%, Availability Set = 99.95%."},
{id:37,domain:"Deploy & Manage Compute",q:"A post-deployment script should install IIS and re-run on reimage. What should you use?",options:["Remote Desktop manual config","Custom Script Extension","Azure Bastion","Azure Automation DSC"],answer:1,explanation:"Custom Script Extension executes scripts during/after deployment and re-runs on reimage."},
{id:38,domain:"Deploy & Manage Compute",q:"VMSS batch processing peaks 8AM-6PM weekdays. Scale between 2-20 instances optimally. What autoscale config?",options:["CPU-based rules only","Schedule-based (10 business hours, 2 off-hours) + CPU-based rules up to 20","Manual scaling","Fixed 20 instances"],answer:1,explanation:"Scheduled + metric-based autoscaling handles both predictable and unexpected demand."},
{id:39,domain:"Deploy & Manage Compute",q:"Can\u2019t SSH into a running Linux VM that was accessible yesterday. No NSG changes. What to try FIRST?",options:["Redeploy","Serial Console","Delete and recreate","Reset NIC"],answer:1,explanation:"Serial Console provides direct console access independent of network connectivity."},
{id:40,domain:"Deploy & Manage Compute",q:"15 containerized microservices need orchestration with auto-scaling, rolling updates, and service discovery. Team knows Kubernetes. BEST service?",options:["Azure Container Instances","Azure Kubernetes Service (AKS)","Azure App Service containers","Azure Container Apps"],answer:1,explanation:"AKS provides full Kubernetes orchestration \u2014 the best fit with existing K8s expertise."},
{id:41,domain:"Deploy & Manage Compute",q:"NC-series VM deployed for ML but GPU not recognized by OS. MOST likely issue?",options:["VM size doesn\u2019t include GPU","NVIDIA GPU driver extension not installed","Subscription lacks GPU quota","GPUs only work on Linux"],answer:1,explanation:"The NVIDIA GPU Driver Extension must be installed separately for the OS to detect the GPU."},
{id:42,domain:"Deploy & Manage Compute",q:"Database VM has high disk latency on Standard HDD. Needs 5,000+ IOPS. What should you do?",options:["Increase VM size","Change to Premium SSD or Ultra Disk","Data disk striping","Enable host caching"],answer:1,explanation:"Standard HDD caps at ~2,000 IOPS. Premium SSD provides up to 20,000 IOPS."},
{id:43,domain:"Deploy & Manage Compute",q:"Resizing from D4s_v3 to E8s_v3 (different family) on a running VM. What happens?",options:["Live resize, no downtime","VM stopped, resized, restarted \u2014 causing downtime","New VM created, old deleted","Resize after next maintenance window"],answer:1,explanation:"Cross-family resize requires stop/deallocate and restart, causing downtime."},
{id:44,domain:"Deploy & Manage Compute",q:"Stateless web API with unpredictable traffic (zero to thousands). Pay only when processing. MOST cost-effective?",options:["App Service Basic tier","Azure Functions Consumption plan","AKS single node","B1s VM"],answer:1,explanation:"Functions Consumption plan charges only for execution time and auto-scales from zero."},
{id:45,domain:"Deploy & Manage Compute",q:"New .NET 6 deployment causes HTTP 500 errors. Need to diagnose without affecting production. What to do?",options:["Enable Application Insights and review exceptions","Deploy to a staging slot and test","SSH in and check logs","Roll back and debug locally"],answer:0,explanation:"Application Insights provides real-time exception tracking without modifying production."},
{id:46,domain:"Deploy & Manage Compute",q:"Gradually shift 20% of production traffic to a staging slot for canary testing. What feature?",options:["Traffic Manager","Deployment slot traffic routing (percentage-based)","Front Door weighted routing","App Gateway path-based routing"],answer:1,explanation:"App Service slots have built-in percentage-based traffic routing."},
{id:47,domain:"Deploy & Manage Compute",q:"Version-controlled generalized VM image with standard software, distributed to multiple regions. What to use?",options:["Managed disk snapshot","Azure Compute Gallery with image definitions and versions","VHD in Blob Storage","ARM template with marketplace image"],answer:1,explanation:"Azure Compute Gallery provides versioned image management with multi-region replication."},
{id:48,domain:"Deploy & Manage Compute",q:"Spot VM batch jobs fail on eviction. Need jobs to resume from where they stopped. What to implement?",options:["Switch to regular VMs","Checkpointing to durable storage + VMSS with Spot VMs for auto-replacement","Increase max bid price","Deploy in low-demand regions"],answer:1,explanation:"Checkpointing saves progress; VMSS replaces evicted instances automatically."},
{id:49,domain:"Deploy & Manage Compute",q:"App Service Plan at 90% CPU with 5 apps. Horizontal scaling doesn\u2019t reduce per-instance CPU. What to do?",options:["More instances","Scale up to a tier with more CPU cores per instance","Separate plans for each app","Restart the plan"],answer:1,explanation:"Each instance is CPU-bound. Vertical scaling provides more CPU per instance."},
{id:50,domain:"Deploy & Manage Compute",q:"128 GB OS disk using 30 GB. Need to reduce storage costs, 30 min downtime OK. What should you do?",options:["Resize OS disk to 32 GB","Cannot shrink managed disks \u2014 create new VM with smaller disk and migrate data","Convert Premium to Standard SSD","Disk Cleanup"],answer:1,explanation:"Azure managed disks cannot be shrunk. Create a new smaller disk and migrate data."},
{id:51,domain:"Deploy & Manage Compute",q:"Container processes a queue and terminates, runs several times daily. 4 CPUs, 16 GB RAM. Pay per-use. What service?",options:["AKS","Azure Container Instances","App Service","VM with Docker"],answer:1,explanation:"ACI charges per-second and is ideal for short-lived burst workloads."},
{id:52,domain:"Deploy & Manage Compute",q:"App Service needs Key Vault secrets with zero credentials in code. What to configure?",options:["Key Vault connection string in App Settings","System-assigned managed identity with Key Vault access","Key Vault access key in web.config","Service principal with client secret in env variable"],answer:1,explanation:"Managed identity provides automatic Azure AD authentication without stored credentials."},
{id:53,domain:"Deploy & Manage Compute",q:"VMSS autoscale at 75%/10min is too slow. Users degrade before instances warm up. How to optimize?",options:["Reduce threshold to 50% and period to 5 minutes","Increase instances per scale-out + warmup period","Fixed instance count at peak","Increase max instances only"],answer:0,explanation:"Lower threshold + shorter period triggers scaling earlier, giving time for warmup."},
{id:54,domain:"Deploy & Manage Compute",q:"Migrate on-premises VMware VM (critical database) to Azure with <1 hour downtime using Azure-native tools. What to use?",options:["Azure Data Box","Azure Migrate with agentless VMware migration","Manual VM creation + DB backup restore","Azure Site Recovery only"],answer:1,explanation:"Azure Migrate continuously replicates; cutover typically takes only minutes."},
{id:55,domain:"Deploy & Manage Compute",q:"Update OS on 10 VMSS instances behind a Load Balancer with zero downtime. What to configure?",options:["Manual one-by-one updates","Rolling upgrade policy with maxBatchInstancePercent and pauseTimeBetweenBatches","Stop all, update, restart","New VMSS + DNS switch"],answer:1,explanation:"Rolling upgrade updates in batches while remaining instances serve traffic."},
{id:56,domain:"Configure & Manage Networking",q:"VNet-A (East US) and VNet-B (West US) VMs need to communicate over the Microsoft backbone. What to configure?",options:["Site-to-site VPN","Global VNet Peering","ExpressRoute","Public IPs on each VM"],answer:1,explanation:"Global VNet Peering connects VNets across regions over the Microsoft backbone."},
{id:57,domain:"Configure & Manage Networking",q:"Hub has VPN Gateway to on-premises. Spoke1 is peered but can\u2019t reach on-premises. What peering setting is missing?",options:["Allow forwarded traffic on Spoke1","Allow gateway transit on Hub + Use remote gateways on Spoke1","UDR on Spoke1 to VPN Gateway","NSG rule for on-premises traffic"],answer:1,explanation:"Both settings are required: gateway transit on hub, remote gateways on spoke."},
{id:58,domain:"Configure & Manage Networking",q:"NSG allows TCP 443 (Priority 100, Any source). VM with public IP still unreachable on 443. What to check?",options:["NIC-level NSG blocking 443","VM OS firewall","Whether the rule is Inbound","All of the above"],answer:3,explanation:"Traffic must pass subnet NSG, NIC NSG, and OS firewall. The rule must be inbound."},
{id:59,domain:"Configure & Manage Networking",q:"Web app needs Azure SQL Database which should NOT be publicly accessible. Same region. RECOMMENDED approach?",options:["SQL firewall allowing app\u2019s outbound IP","Private Endpoint for SQL in the app\u2019s VNet","Service Endpoint for Microsoft.Sql","SQL VNet injection"],answer:1,explanation:"Private Endpoint assigns a private IP, eliminating public exposure entirely."},
{id:60,domain:"Configure & Manage Networking",q:"Route all outbound internet traffic from a subnet through an NVA at 10.0.2.4. What to configure?",options:["UDR: 0.0.0.0/0 next hop Virtual Appliance at 10.0.2.4","NSG redirect rule","NAT Gateway to NVA","BGP from NVA"],answer:0,explanation:"A UDR with the default route pointing to the NVA forces all internet-bound traffic through it."},
{id:61,domain:"Configure & Manage Networking",q:"Azure Firewall in hub blocks all web traffic from spokes. Logs show denied. What to configure?",options:["Network Rule allowing all outbound","Application Rule collection for required FQDNs or web categories","NAT rule","Disable the Firewall"],answer:1,explanation:"Azure Firewall denies all by default. Application Rules allow HTTP/HTTPS with FQDN filtering."},
{id:62,domain:"Configure & Manage Networking",q:"HTTPS Application Gateway returns SSL cert errors to users. The cert is on the gateway. MOST likely cause?",options:["Backend VMs lack the same cert","Certificate expired or chain is incomplete","Listener configured for HTTP","NSG blocking 443"],answer:1,explanation:"Client-facing SSL errors point to the gateway\u2019s cert: expired, wrong domain, or incomplete chain."},
{id:63,domain:"Configure & Manage Networking",q:"Distribute traffic across East US and West Europe based on user location. What service?",options:["Azure Load Balancer","Application Gateway","Traffic Manager with Geographic routing","Front Door with priority routing"],answer:2,explanation:"Traffic Manager Geographic routing directs users based on DNS query origin location."},
{id:64,domain:"Configure & Manage Networking",q:"LB uses TCP 80 health probes. A VM\u2019s web service crashes but VM is running. Users see intermittent errors. What to change?",options:["Increase probe interval","Change to HTTP health probe checking a specific health endpoint","Add more VMs","Use Basic SKU LB"],answer:1,explanation:"TCP only checks port connectivity. HTTP probes verify the application is functioning."},
{id:65,domain:"Configure & Manage Networking",q:"Need guaranteed 1 Gbps, low-latency connection from on-premises that doesn\u2019t use the public internet. What to use?",options:["Site-to-Site VPN","ExpressRoute with private peering","Point-to-Site VPN","Virtual WAN with VPN"],answer:1,explanation:"ExpressRoute provides private, dedicated connectivity with guaranteed bandwidth."},
{id:66,domain:"Configure & Manage Networking",q:"DB subnet should only accept traffic from App subnet on port 1433. All other inbound blocked. How to configure?",options:["NSG: Allow TCP 1433 from App subnet (priority 100), Deny all (priority 200)","Per-server firewall rules","Separate VNet for DB","Azure Firewall between subnets"],answer:0,explanation:"NSG with specific allow at higher priority than deny-all restricts access precisely."},
{id:67,domain:"Configure & Manage Networking",q:"Azure VMs need to resolve on-premises DNS names under \u2018internal.contoso.com\u2019. What to configure?",options:["Azure Private DNS Zone with manual replication","Azure DNS Private Resolver with outbound forwarding to on-premises DNS","Custom DNS per VM","Azure Public DNS Zone"],answer:1,explanation:"DNS Private Resolver forwards queries for on-premises zones to on-premises DNS servers."},
{id:68,domain:"Configure & Manage Networking",q:"After deploying NAT Gateway on a subnet with 50 VMs, some IP-whitelisted third-party API calls fail. What happened?",options:["NAT Gateway doesn\u2019t support outbound","Outbound IPs changed to NAT Gateway\u2019s IP(s), not whitelisted by APIs","NAT Gateway blocks outbound","APIs don\u2019t support Azure"],answer:1,explanation:"NAT Gateway replaces all outbound IPs. New IPs must be added to third-party allowlists."},
{id:69,domain:"Configure & Manage Networking",q:"PCI-DSS network design: WAF, subnet segmentation, encrypted inter-tier traffic, centralized flow logging. Which combination?",options:["App Gateway WAF + NSGs + VNet encryption + NSG Flow Logs to Log Analytics","Load Balancer + per-VM firewalls + Azure Monitor","Front Door + single subnet + App Insights","Third-party firewall only"],answer:0,explanation:"This combination covers all PCI-DSS requirements: WAF, segmentation, encryption, flow logging."},
{id:70,domain:"Configure & Manage Networking",q:"VMs need Azure Storage access without public internet but can\u2019t use Private Endpoints (budget). What alternative?",options:["VPN Gateway to storage","Service Endpoint for Microsoft.Storage","ExpressRoute","VNet proxy server"],answer:1,explanation:"Service Endpoints provide Azure backbone connectivity to Storage at no additional cost."},
{id:71,domain:"Configure & Manage Networking",q:"Application Gateway app targeted by SQL injection. Block attacks with minimal configuration. What to do?",options:["Custom NSG rules","Enable WAF with OWASP rule set in Prevention mode","Custom application code","Azure DDoS Protection"],answer:1,explanation:"WAF with OWASP rules detects and blocks SQL injection and OWASP Top 10 attacks."},
{id:72,domain:"Configure & Manage Networking",q:"Created A record in Azure DNS for \u2018app.contoso.com\u2019 but it doesn\u2019t resolve. MOST likely issue?",options:["TTL too high","Domain registrar NS records still point to the old DNS provider","Azure DNS doesn\u2019t support A records","VM public IP changed (dynamic)"],answer:1,explanation:"NS records at the registrar must be updated to Azure DNS name servers."},
{id:73,domain:"Configure & Manage Networking",q:"Adding a subnet for Application Gateway v2 with limited address space. What is the MINIMUM subnet size?",options:["/28 (16 addresses)","/26 (64 addresses)","/24 (256 addresses)","/27 (32 addresses)"],answer:3,explanation:"Minimum for Application Gateway v2 is /27 (32 addresses)."},
{id:74,domain:"Configure & Manage Networking",q:"Two VMs in same VNet, different subnets, can\u2019t communicate. Both subnets have NSGs. Same-subnet pings work. Check FIRST?",options:["VNet peering between subnets","NSG rules for deny rules blocking inter-subnet traffic","Availability zone differences","VNet DNS settings"],answer:1,explanation:"Intra-VNet subnets communicate by default. NSG deny rules are the most likely blocker."},
{id:75,domain:"Configure & Manage Networking",q:"Hub-spoke: spoke-to-spoke traffic bypasses hub NVA. Need all east-west traffic inspected. What to configure?",options:["Direct spoke-to-spoke peering","UDRs on each spoke routing non-local traffic to the hub NVA","NSG redirects to hub","Azure Firewall per spoke"],answer:1,explanation:"UDRs override default peering routes, forcing traffic through the hub NVA."},
{id:76,domain:"Configure & Manage Networking",q:"Point-to-Site VPN for developers on Windows AND macOS. Which protocol?",options:["IKEv2 only","SSTP only","OpenVPN (SSL)","L2TP/IPSec"],answer:2,explanation:"OpenVPN supports Windows, macOS, Linux, Android, and iOS."},
{id:77,domain:"Configure & Manage Networking",q:"Standard LB with 5 backend VMs (no public IPs). None can reach the internet outbound. What to configure?",options:["NAT Gateway on the subnet","NSG outbound allow rule","Public IP on the LB frontend","IP forwarding on VMs"],answer:0,explanation:"Standard LB doesn\u2019t provide default outbound access. NAT Gateway is the recommended solution."},
{id:78,domain:"Configure & Manage Networking",q:"Global entry point routing users to nearest region with SSL offloading and URL-based routing. What to use?",options:["Traffic Manager","Azure Front Door","Azure Load Balancer","App Gateway per region"],answer:1,explanation:"Front Door is a global L7 load balancer with anycast, SSL termination, and URL-based routing."},
{id:79,domain:"Configure & Manage Networking",q:"Private Endpoint for Azure SQL: on-premises clients work but VNet VMs can\u2019t resolve the FQDN. What is missing?",options:["VNet DNS server config","Private DNS Zone for \u2018privatelink.database.windows.net\u2019 linked to the VNet","On-premises DNS A record","Conditional forwarder on VMs"],answer:1,explanation:"A Private DNS Zone linked to the VNet is needed for Azure resources to resolve private endpoint FQDNs."},
{id:80,domain:"Configure & Manage Networking",q:"Azure Firewall shows SNAT port exhaustion for 500+ VMs. How to resolve?",options:["Increase firewall SKU","Add multiple public IPs to increase the SNAT port pool","Reduce VMs behind firewall","TCP keep-alive on all VMs"],answer:1,explanation:"Each public IP adds 2,496 SNAT ports per destination. Multiple IPs scale linearly."},
{id:81,domain:"Monitor & Maintain Resources",q:"Production VM has intermittent CPU spikes. Need to identify processes and establish baselines. What to use?",options:["Azure Monitor Metrics only","VM Insights with performance counters and Map feature","Azure Advisor","Activity Log"],answer:1,explanation:"VM Insights provides process-level detail and dependency mapping beyond basic metrics."},
{id:82,domain:"Monitor & Maintain Resources",q:"Alert when any VM in \u2018Production\u2019 RG exceeds 90% CPU for 5 min, plus auto-restart. What to configure?",options:["Metric alert scoped to RG + Action Group (email + Automation runbook to restart)","Azure Advisor alert","Log Analytics query every 5 min","Service Health alert"],answer:0,explanation:"Metric alerts can scope to a resource group and trigger Action Groups for notification + remediation."},
{id:83,domain:"Monitor & Maintain Resources",q:"End-to-end transaction tracing from browser through API to database for a multi-tier app. What to enable?",options:["Azure Monitor metrics per tier","Application Insights with distributed tracing on all tiers","Network Watcher packet captures","Log Analytics with VM perf counters"],answer:1,explanation:"Application Insights distributed tracing correlates requests across tiers automatically."},
{id:84,domain:"Monitor & Maintain Resources",q:"Storage account has intermittent high E2E latency (>500ms) on blob reads. Azure infra or client issue? What to examine?",options:["Azure Status page","Compare E2E Latency vs Server Latency \u2014 large gap means client/network issue","Activity log","NSG Flow Logs"],answer:1,explanation:"If Server Latency is normal but E2E Latency is high, the bottleneck is client-side or network."},
{id:85,domain:"Monitor & Maintain Resources",q:"Azure SQL briefly offline at 2 AM. Planned or unplanned? Where to look FIRST?",options:["Azure Monitor Metrics","Azure Service Health + Resource Health for the resource\u2019s history","SQL audit logs","Azure AD sign-in logs"],answer:1,explanation:"Service Health shows platform incidents; Resource Health shows specific resource availability history."},
{id:86,domain:"Monitor & Maintain Resources",q:"Centralize logs from 50 VMs, 10 App Services, 5 SQL Databases with cross-resource correlation. What to use?",options:["Azure Storage Account","Log Analytics Workspace with Azure Monitor","Azure Event Hubs","Individual resource logs"],answer:1,explanation:"Log Analytics is the centralized repository with KQL for cross-resource correlation."},
{id:87,domain:"Monitor & Maintain Resources",q:"LB diagnostics configured to Log Analytics but no data after 24 hours. LB is active. What to check?",options:["Correct log categories","Whether the LB is Basic SKU \u2014 Basic doesn\u2019t support diagnostics","Workspace region","Azure Monitor Agent on LB"],answer:1,explanation:"Basic SKU Load Balancers do not support diagnostic logging. Standard SKU required."},
{id:88,domain:"Monitor & Maintain Resources",q:"Subscription costs jumped 40%. Finance needs a resource breakdown. BEST tool?",options:["Azure Advisor","Cost Management \u2014 Cost Analysis with resource type/group/service filtering","Azure Monitor Metrics","Pricing Calculator"],answer:1,explanation:"Cost Analysis provides detailed breakdowns with filtering and month-over-month comparison."},
{id:89,domain:"Monitor & Maintain Resources",q:"VMs in East US + Azure SQL. RPO 1 hour, RTO 4 hours. Automatic recovery from regional outage. What to implement?",options:["Azure Backup daily","Azure Site Recovery + SQL geo-replication","Availability Zones same region","VM snapshots separate account"],answer:1,explanation:"ASR (<1hr RPO) + SQL geo-replication (near-zero RPO) meet both requirements for regional DR."},
{id:90,domain:"Monitor & Maintain Resources",q:"VM shows \u2018Running\u2019 but RDP fails. Correct troubleshooting sequence?",options:["Delete and recreate","Boot Diagnostics \u2192 Serial Console \u2192 VM Agent \u2192 Run Command \u2192 Redeploy","Resize to force restart","Support ticket first"],answer:1,explanation:"Start with non-disruptive diagnostics, escalating only if needed."},
{id:91,domain:"Monitor & Maintain Resources",q:"Automated solution: find VMs with avg CPU <5% over 14 days, weekly report. What to use?",options:["Azure Advisor with email alerts","Scheduled Log Analytics KQL query + Action Group","Manual weekly checks","Azure Policy"],answer:1,explanation:"Scheduled KQL queries analyze metrics over 14 days and trigger automated weekly reports."},
{id:92,domain:"Monitor & Maintain Resources",q:"Daily backup at 2 AM. Files deleted at 4 PM. Need only those files, not a full VM restore. What to do?",options:["Restore entire VM","Azure Backup File Recovery \u2014 mount recovery point and copy specific files","New VM from backup, extract files","Site Recovery failover"],answer:1,explanation:"File Recovery mounts a recovery point as a drive for browsing and copying specific files."},
{id:93,domain:"Monitor & Maintain Resources",q:"Logic App with Event Grid trigger not firing on VM creation. What to verify?",options:["Event Grid filter for correct event type + VM resource provider","Logic App permissions","Same region for VMs and Logic App","Event Grid doesn\u2019t support subscription events"],answer:0,explanation:"The event filter must include the correct event type and resource provider filter."},
{id:94,domain:"Monitor & Maintain Resources",q:"Which KQL query shows top 10 VMs by average CPU over 24 hours?",options:["Perf | where CounterName == \u2018% Processor Time\u2019 | where TimeGenerated > ago(24h) | summarize AvgCPU = avg(CounterValue) by Computer | top 10 by AvgCPU desc","SELECT TOP 10 Computer, AVG(CPU) FROM Perf...","AzureMetrics | where MetricName == \u2018CPU\u2019 | take 10","Heartbeat | summarize count() by Computer | top 10"],answer:0,explanation:"KQL is the correct language. SQL syntax is not supported in Log Analytics."},
{id:95,domain:"Monitor & Maintain Resources",q:"All \u2018Production\u2019 RG VMs must be backed up daily, 90-day retention. New VMs auto-included. What to use?",options:["Manual backup config per VM","Azure Policy with built-in backup policy scoped to RG","Automation runbook","Site Recovery"],answer:1,explanation:"Azure Policy auto-enrolls new VMs into a Recovery Services Vault with the backup policy."},
{id:96,domain:"Monitor & Maintain Resources",q:"App Service slows 12\u20131 PM daily. Is it code, DB, or dependencies? What gives BEST visibility?",options:["Azure Monitor Metrics","Application Insights Performance blade with dependency analysis + Profiler","App Service logs","Network Watcher"],answer:1,explanation:"Performance blade shows dependency durations. Profiler gives code-level timing."},
{id:97,domain:"Monitor & Maintain Resources",q:"$10K/month budget. At $8K forecasted, notify finance. At $10K actual, block new resource creation. What to configure?",options:["Azure Budget: 80% forecasted alert (email) + 100% actual alert (runbook to apply deny policy)","Cost Management alerts only","Advisor recommendations","Subscription spending limit"],answer:0,explanation:"Budgets support forecasted + actual thresholds. A runbook can apply a deny-all policy at 100%."},
{id:98,domain:"Monitor & Maintain Resources",q:"Unified dashboard: VM perf, App Service requests, SQL DTU, custom logs. Auto-refresh 5 min, shared with ops. What approach?",options:["Separate dashboards per resource","Azure Monitor Workbook with metrics + KQL + Resource Graph, shared via RBAC","Power BI export","Log Analytics saved searches"],answer:1,explanation:"Workbooks combine multiple data sources with auto-refresh and RBAC sharing."},
{id:99,domain:"Monitor & Maintain Resources",q:"Hundreds of alert emails daily, many duplicates. Critical alerts missed. What to do?",options:["Disable all alerts","Alert Processing Rules for suppression/grouping + proper severity + smart notification grouping","Separate email lists","Increase all thresholds"],answer:1,explanation:"Alert Processing Rules reduce noise while preserving critical notifications."},
{id:100,domain:"Monitor & Maintain Resources",q:"Azure Activity Logs must be retained 2 years (default 90 days). What to configure?",options:["Cannot extend beyond 90 days","Diagnostic Setting to Log Analytics with 2-year retention or Storage Account","Manual export every 90 days","Azure AD audit log integration"],answer:1,explanation:"Diagnostic Settings export Activity Logs to Log Analytics or Storage for extended retention."}
];

const DOMAINS=[
{name:"Manage Azure Identities & Governance",range:[1,20],color:"#0078D4"},
{name:"Implement & Manage Storage",range:[21,35],color:"#00A86B"},
{name:"Deploy & Manage Compute",range:[36,55],color:"#E74856"},
{name:"Configure & Manage Networking",range:[56,80],color:"#8B5CF6"},
{name:"Monitor & Maintain Resources",range:[81,100],color:"#F59E0B"}
];

const getDomain=(id)=>DOMAINS.find(d=>id>=d.range[0]&&id<=d.range[1]);

let state={phase:"start",candidateName:"",answers:{},flagged:new Set(),currentQ:0,timeLeft:3*60*60,showNav:false,results:null,reviewFilter:"wrong",showConfirm:false,timerInterval:null};

function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function startTimer(){state.timerInterval=setInterval(()=>{state.timeLeft--;if(state.timeLeft<=0){clearInterval(state.timerInterval);submitExam();}else{const el=document.getElementById('timer');if(el){el.textContent=fmt(state.timeLeft);el.className='timer '+(state.timeLeft<600?'red':state.timeLeft<1800?'yellow':'green');}}},1000);}

function submitExam(){
  clearInterval(state.timerInterval);
  let correct=0;
  const details=QUESTIONS.map(q=>{const u=state.answers[q.id];const c=u===q.answer;if(c)correct++;return{...q,userAnswer:u,isCorrect:c};});
  const domainScores=DOMAINS.map(d=>{const qs=details.filter(q=>q.id>=d.range[0]&&q.id<=d.range[1]);const c=qs.filter(q=>q.isCorrect).length;return{...d,total:qs.length,correct:c,pct:Math.round((c/qs.length)*100)};});
  state.results={correct,total:100,pct:Math.round(correct),details,domainScores,passed:correct>=70,timestamp:new Date().toLocaleString()};
  state.phase="results";state.showConfirm=false;render();window.scrollTo(0,0);
}

function selectOption(qId,oi){state.answers[qId]=oi;render();}
function toggleFlag(qId){if(state.flagged.has(qId))state.flagged.delete(qId);else state.flagged.add(qId);render();}
function goToQ(idx){state.currentQ=idx;render();const qa=document.getElementById('question-area');if(qa)qa.scrollTop=0;}

function downloadPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const r=state.results;
  const W=210,H=297,M=15;
  const pw=W-2*M;
  let y=M;

  // Colors
  const blue=[0,120,212],darkBg=[13,27,42],green=[0,168,107],red=[231,72,86],gray=[100,120,140],darkText=[30,40,55],lightGray=[180,190,200];

  // Header bar
  doc.setFillColor(...darkBg);
  doc.rect(0,0,W,45,  'F');
  doc.setFillColor(...blue);
  doc.rect(0,44,W,1.5,'F');

  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
  doc.text('MICROSOFT AZURE',M,14);
  doc.setFontSize(26);doc.text('AZ-104 Examination Report',M,28);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...lightGray);
  doc.text('Azure Administrator Evaluation',M,36);
  doc.text('CONFIDENTIAL',W-M,14,{align:'right'});

  y=55;

  // Candidate info box
  doc.setFillColor(245,247,250);doc.roundedRect(M,y,pw,28,2,2,'F');
  doc.setDrawColor(220,225,230);doc.roundedRect(M,y,pw,28,2,2,'S');
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...gray);
  doc.text('CANDIDATE',M+6,y+8);
  doc.text('DATE',M+pw/2+6,y+8);
  doc.text('STATUS',M+6,y+20);
  doc.text('SCORE',M+pw/2+6,y+20);
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...darkText);
  doc.text(state.candidateName||'N/A',M+35,y+8);
  doc.text(r.timestamp,M+pw/2+22,y+8);
  doc.setTextColor(...(r.passed?green:red));
  doc.text(r.passed?'PASSED':'FAILED',M+30,y+20);
  doc.setTextColor(...darkText);
  doc.text(`${r.correct}/100 (${r.pct}%)`,M+pw/2+26,y+20);

  y+=36;

  // Score visual
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...darkText);
  doc.text('Overall Score',M,y);
  y+=6;
  doc.setFillColor(230,233,238);doc.roundedRect(M,y,pw,6,3,3,'F');
  const barW=Math.max(0,Math.min(pw,(r.pct/100)*pw));
  if(r.passed){doc.setFillColor(...green);}else{doc.setFillColor(...red);}
  doc.roundedRect(M,y,barW,6,3,3,'F');
  doc.setFontSize(9);doc.setTextColor(...darkText);
  doc.text(`${r.pct}%`,M+barW+3,y+5);
  doc.setTextColor(...gray);doc.text('Passing: 70%',W-M,y+5,{align:'right'});

  y+=16;

  // Domain breakdown table
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...darkText);
  doc.text('Domain Breakdown',M,y);y+=3;

  const domainData=r.domainScores.map(d=>[d.name,`${d.correct}/${d.total}`,`${d.pct}%`,d.pct>=70?'Pass':'Fail']);
  doc.autoTable({
    startY:y,
    head:[['Domain','Score','Percentage','Status']],
    body:domainData,
    margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:9,cellPadding:4},
    headStyles:{fillColor:blue,textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[245,247,250]},
    columnStyles:{0:{cellWidth:80},1:{cellWidth:25,halign:'center'},2:{cellWidth:28,halign:'center'},3:{cellWidth:22,halign:'center'}},
    didParseCell:function(data){
      if(data.column.index===3&&data.section==='body'){
        data.cell.styles.textColor=data.cell.raw==='Pass'?green:red;
        data.cell.styles.fontStyle='bold';
      }
    }
  });

  y=doc.lastAutoTable.finalY+12;

  // Quick Answer Grid
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...darkText);
  doc.text('Answer Grid',M,y);y+=3;

  const gridData=[];
  for(let row=0;row<10;row++){
    const rowData=[];
    for(let col=0;col<10;col++){
      const qIdx=row*10+col;
      const q=QUESTIONS[qIdx];
      const userAns=state.answers[q.id];
      const isCorrect=userAns===q.answer;
      const letter=userAns!==undefined?String.fromCharCode(65+userAns):'-';
      rowData.push(`Q${q.id}: ${letter}`);
    }
    gridData.push(rowData);
  }

  doc.autoTable({
    startY:y,
    body:gridData,
    margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:6.5,cellPadding:2,halign:'center',lineWidth:0.1,lineColor:[200,205,210]},
    didParseCell:function(data){
      if(data.section==='body'){
        const qIdx=data.row.index*10+data.column.index;
        if(qIdx<100){
          const q=QUESTIONS[qIdx];
          const u=state.answers[q.id];
          const c=u===q.answer;
          if(u===undefined){data.cell.styles.textColor=[160,170,180];}
          else if(c){data.cell.styles.textColor=green;data.cell.styles.fontStyle='bold';}
          else{data.cell.styles.textColor=red;data.cell.styles.fontStyle='bold';}
        }
      }
    }
  });

  // Wrong answers section
  const wrong=r.details.filter(d=>!d.isCorrect);
  if(wrong.length>0){
    doc.addPage();y=M;
    doc.setFillColor(...darkBg);doc.rect(0,0,W,22,'F');
    doc.setFillColor(...red);doc.rect(0,21,W,1.5,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(255,255,255);
    doc.text(`Incorrect Answers \u2014 ${wrong.length} Questions`,M,15);
    y=30;

    wrong.forEach((q,idx)=>{
      if(y>H-60){doc.addPage();y=M;}
      const dm=getDomain(q.id);

      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...red);
      doc.text(`Q${q.id}`,M,y);
      doc.setTextColor(...gray);doc.setFont('helvetica','normal');doc.setFontSize(8);
      doc.text(` \u2014 ${dm.name}`,M+10,y);
      y+=5;

      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...darkText);
      const qLines=doc.splitTextToSize(q.q,pw);
      doc.text(qLines,M,y);y+=qLines.length*4.2+2;

      const yourLetter=q.userAnswer!==undefined?String.fromCharCode(65+q.userAnswer):'(unanswered)';
      const correctLetter=String.fromCharCode(65+q.answer);

      doc.setFont('helvetica','bold');doc.setFontSize(9);
      doc.setTextColor(...red);doc.text(`Your answer: ${yourLetter}`,M+2,y);
      doc.setTextColor(...green);doc.text(`Correct: ${correctLetter}`,M+60,y);
      y+=5;

      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(60,80,100);
      const correctText=q.options[q.answer];
      const cLines=doc.splitTextToSize(`\u2713 ${correctLetter}. ${correctText}`,pw-4);
      doc.text(cLines,M+2,y);y+=cLines.length*3.5+2;

      doc.setFontSize(8);doc.setTextColor(80,100,130);
      const eLines=doc.splitTextToSize(`Explanation: ${q.explanation}`,pw-4);
      doc.text(eLines,M+2,y);y+=eLines.length*3.5+4;

      doc.setDrawColor(230,233,238);doc.line(M,y,W-M,y);y+=5;
    });
  }

  // Footer on last page
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...gray);
  doc.text('This report is confidential and intended for evaluation purposes only.',W/2,H-8,{align:'center'});

  const safeName=(state.candidateName||'Candidate').replace(/[^a-zA-Z0-9]/g,'_');
  doc.save(`AZ104_Result_${safeName}_${new Date().toISOString().slice(0,10)}.pdf`);
}

function render(){
  const app=document.getElementById('app');
  if(state.phase==='start')renderStart(app);
  else if(state.phase==='exam')renderExam(app);
  else if(state.phase==='results')renderResults(app);
}

function renderStart(app){
  let domainRows=DOMAINS.map(d=>`<div class="domain-row"><div class="domain-row-left"><div class="domain-dot" style="background:${d.color}"></div><span>${d.name}</span></div><span class="domain-row-right">Q${d.range[0]}\u2013Q${d.range[1]}</span></div>`).join('');
  app.innerHTML=`
  <div class="start-screen"><div class="start-inner">
    <div class="start-badge">Microsoft Azure</div>
    <div class="start-title">AZ-104</div>
    <div class="start-subtitle">Azure Administrator Evaluation Exam</div>
    <div class="start-card">
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-val">100</div><div class="stat-label">Scenario Questions</div></div>
        <div class="stat-box"><div class="stat-val">3 hrs</div><div class="stat-label">Time Limit</div></div>
        <div class="stat-box"><div class="stat-val">70%</div><div class="stat-label">Passing Score</div></div>
        <div class="stat-box"><div class="stat-val">5</div><div class="stat-label">Domains</div></div>
      </div>
      ${domainRows}
    </div>
    <div class="name-input-wrap">
      <div class="name-label">Engineer / Candidate Name</div>
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your full name to begin..." value="${state.candidateName}" oninput="state.candidateName=this.value.trim();document.getElementById('startBtn').disabled=!this.value.trim();" onkeydown="if(event.key==='Enter'&&this.value.trim()){state.phase='exam';startTimer();render();}">
    </div>
    <button id="startBtn" class="btn-start" ${state.candidateName?'':'disabled'} onclick="if(state.candidateName){state.phase='exam';startTimer();render();}">START EXAM</button>
    <div class="start-note">No external resources permitted during the exam</div>
  </div></div>`;
  document.getElementById('nameInput').focus();
}

function renderExam(app){
  const q=QUESTIONS[state.currentQ];const domain=getDomain(q.id);const answered=Object.keys(state.answers).length;
  let navHTML='';
  if(state.showNav){
    let nd=DOMAINS.map(d=>{let btns='';for(let i=d.range[0];i<=d.range[1];i++){const idx=i-1;const a=state.answers[i]!==undefined;const c=idx===state.currentQ;const f=state.flagged.has(i);let cls='nav-btn';if(c)cls+=' current';else if(a)cls+=' answered';btns+=`<button class="${cls}" onclick="goToQ(${idx})">${i}${f?'<div class="flag-dot"></div>':''}</button>`;}return`<div class="nav-domain-label" style="color:${d.color}">${d.name}</div><div class="nav-grid">${btns}</div>`;}).join('');
    navHTML=`<div class="nav-panel"><div class="nav-title">Question Navigator</div><div class="nav-legend"><div class="nav-legend-item"><div class="nav-legend-dot" style="background:#00A86B"></div>Answered</div><div class="nav-legend-item"><div class="nav-legend-dot" style="background:#0078D4"></div>Current</div><div class="nav-legend-item"><div class="nav-legend-dot" style="background:#F59E0B"></div>Flagged</div><div class="nav-legend-item"><div class="nav-legend-dot" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)"></div>Unanswered</div></div>${nd}</div>`;
  }
  let opts=q.options.map((opt,oi)=>`<button class="option-btn${state.answers[q.id]===oi?' selected':''}" onclick="selectOption(${q.id},${oi})"><div class="option-letter">${String.fromCharCode(65+oi)}</div><span class="option-text">${opt}</span></button>`).join('');
  let footR=state.currentQ===99?`<button class="btn-submit-bottom" onclick="state.showConfirm=true;render();">Submit Exam</button>`:`<button class="btn-next" onclick="goToQ(${state.currentQ+1})">Next \u2192</button>`;
  let modal='';
  if(state.showConfirm){const un=100-Object.keys(state.answers).length;modal=`<div class="modal-overlay"><div class="modal-box"><div class="modal-title">Submit Exam?</div><div class="modal-text">${state.candidateName}, you have answered ${Object.keys(state.answers).length} of 100 questions.</div>${un>0?`<div class="modal-warn">\u26A0 ${un} unanswered questions will be marked incorrect.</div>`:''}<div class="modal-btns"><button class="modal-btn-cancel" onclick="state.showConfirm=false;render();">Go Back</button><button class="modal-btn-confirm" onclick="submitExam()">Submit Now</button></div></div></div>`;}
  app.innerHTML=`
  <div class="topbar"><div class="topbar-left"><span class="topbar-logo">AZ-104</span><span class="topbar-name">${state.candidateName}</span><span class="topbar-count">${answered}/100</span></div><div class="topbar-right"><div id="timer" class="timer ${state.timeLeft<600?'red':state.timeLeft<1800?'yellow':'green'}">${fmt(state.timeLeft)}</div><button class="btn-nav-toggle${state.showNav?' active':''}" onclick="state.showNav=!state.showNav;render();">${state.showNav?'Hide':'Nav'}</button><button class="btn-submit-top" onclick="state.showConfirm=true;render();">Submit</button></div></div>
  <div class="exam-layout">${navHTML}<div class="question-area" id="question-area"><div class="question-inner"><div class="q-header"><div class="q-header-left"><span class="q-number" style="color:${domain.color}">Q${q.id}</span><span class="q-domain-badge" style="color:${domain.color};background:${domain.color}14">${domain.name}</span></div><button class="btn-flag${state.flagged.has(q.id)?' active':''}" onclick="toggleFlag(${q.id})">${state.flagged.has(q.id)?'\u2605 Flagged':'\u2606 Flag'}</button></div><div class="q-text">${q.q}</div><div class="options-grid">${opts}</div><div class="q-footer"><button class="btn-prev" onclick="goToQ(${state.currentQ-1})" ${state.currentQ===0?'disabled':''}>\u2190 Previous</button>${footR}</div></div></div></div>${modal}`;
}

function renderResults(app){
  const r=state.results;
  let dc=r.domainScores.map(d=>`<div class="domain-score-card"><div class="domain-score-top"><div class="domain-score-left"><div style="width:4px;height:28px;border-radius:2px;background:${d.color}"></div><span style="font-size:14px;font-weight:600">${d.name}</span></div><span style="font-size:15px;font-weight:800;color:${d.pct>=70?'#00A86B':'#E74856'}">${d.correct}/${d.total} (${d.pct}%)</span></div><div class="domain-score-bar-bg"><div class="domain-score-bar" style="width:${d.pct}%;background:${d.pct>=70?d.color:'#E74856'}"></div></div></div>`).join('');
  const wc=r.details.filter(d=>!d.isCorrect).length;const fc=state.flagged.size;
  let filtered;
  if(state.reviewFilter==='wrong')filtered=r.details.filter(d=>!d.isCorrect);
  else if(state.reviewFilter==='flagged')filtered=r.details.filter(d=>state.flagged.has(d.id));
  else filtered=r.details;
  let cards=filtered.map(d=>{const dm=getDomain(d.id);let opts=d.options.map((opt,oi)=>{const co=oi===d.answer;const uo=oi===d.userAnswer;const wp=uo&&!co;let cls='review-opt';if(co)cls+=' correct-opt';if(wp)cls+=' wrong-pick';return`<div class="${cls}"><span style="font-weight:700;margin-right:8px">${String.fromCharCode(65+oi)}.</span>${opt}${co?'<span class="tag" style="color:#4ade80">\u2713 CORRECT</span>':''}${wp?'<span class="tag" style="color:#ff8a94">\u2717 YOUR ANSWER</span>':''}${uo&&co?'<span class="tag" style="color:#4ade80">\u2713 YOUR ANSWER</span>':''}</div>`;}).join('');return`<div class="review-card ${d.isCorrect?'correct':'wrong'}"><div class="review-header"><div class="review-header-left"><span class="review-qnum" style="color:${dm.color};background:${dm.color}18">Q${d.id}</span><span class="review-domain">${dm.name}</span></div><span style="font-size:18px">${d.isCorrect?'\u2713':'\u2717'}</span></div><div class="review-qtext">${d.q}</div><div class="review-options">${opts}</div><div class="explanation-box"><strong>Explanation: </strong>${d.explanation}</div></div>`;}).join('');

  app.innerHTML=`
  <div class="results-wrap"><div class="results-inner">
    <div class="results-header">
      <div class="results-candidate">${state.candidateName}</div>
      <div class="results-date">${r.timestamp}</div>
      <div class="results-badge ${r.passed?'pass':'fail'}">${r.passed?'\u2713 EXAMINATION PASSED':'\u2717 EXAMINATION FAILED'}</div>
      <div class="results-score ${r.passed?'pass':'fail'}">${r.pct}%</div>
      <div class="results-sub">${r.correct} / ${r.total} correct \u00B7 Passing: 70%</div>
    </div>
    <div class="domain-scores">${dc}</div>
    <div class="action-bar">
      <div class="filter-btns">
        <button class="filter-btn${state.reviewFilter==='wrong'?' active':''}" onclick="state.reviewFilter='wrong';render();">Wrong (${wc})</button>
        <button class="filter-btn${state.reviewFilter==='flagged'?' active':''}" onclick="state.reviewFilter='flagged';render();">Flagged (${fc})</button>
        <button class="filter-btn${state.reviewFilter==='all'?' active':''}" onclick="state.reviewFilter='all';render();">All Questions</button>
      </div>
      <button class="btn-download" onclick="downloadPDF()">\u2B07 Download Result PDF</button>
    </div>
    <div>${cards}</div>
    <div style="text-align:center;margin-top:32px;padding-bottom:40px">
      <button class="btn-retake" onclick="state={phase:'start',candidateName:'',answers:{},flagged:new Set(),currentQ:0,timeLeft:10800,showNav:false,results:null,reviewFilter:'wrong',showConfirm:false,timerInterval:null};render();window.scrollTo(0,0);">RETAKE EXAM</button>
    </div>
  </div></div>`;
}

render();
</script>
</body>
</html>
