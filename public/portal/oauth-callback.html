<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in…</title>
<style>
  body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f8f9fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; flex-direction:column; gap:16px; }
  .spinner { width:36px; height:36px; border:3px solid #e5e7eb; border-top-color:#0078d4; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { color:#6b7280; font-size:.9rem; margin:0; }
</style>
</head>
<body>
<div class="spinner"></div>
<p id="msg">Completing sign-in…</p>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var error = params.get('oauth_error');

  // Primary: postMessage to opener
  if (window.opener && !window.opener.closed) {
    try {
      if (token) {
        window.opener.postMessage({ type: 'oauth_success', token: token }, window.location.origin);
      } else if (error) {
        window.opener.postMessage({ type: 'oauth_error', error: decodeURIComponent(error) }, window.location.origin);
      }
      setTimeout(function() { window.close(); }, 400);
      return;
    } catch(e) { /* fall through to localStorage */ }
  }

  // Fallback: localStorage — polled by the main portal page
  if (token) {
    localStorage.setItem('_oauth_result', JSON.stringify({ token: token, ts: Date.now() }));
    document.getElementById('msg').textContent = 'Signed in! Closing…';
    setTimeout(function() { window.close(); }, 600);
  } else if (error) {
    localStorage.setItem('_oauth_result', JSON.stringify({ error: decodeURIComponent(error), ts: Date.now() }));
    document.getElementById('msg').textContent = 'Redirecting…';
    setTimeout(function() { window.close(); }, 600);
  } else {
    // No token/error — just close
    window.close();
  }
})();
</script>
</body>
</html>
